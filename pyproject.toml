[project]
name = "ytdigest"
version = "0.1.0"
description = "Überwacht YouTube-RSS-Feeds, beschafft Transkripte neuer Videos und legt sie dateibasiert ab."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Daniel Jeremias" }]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "feedparser>=6.0",
    "yt-dlp>=2024.8",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.optional-dependencies]
asr = ["faster-whisper>=1.0"]

[project.scripts]
ytdigest = "ytdigest.cli:app"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ytdigest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Typer nutzt Funktionsaufrufe in Argument-Defaults bewusst

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
ignore_missing_imports = true
